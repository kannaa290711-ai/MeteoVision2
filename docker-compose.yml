version: '3.8'

services:
  db:
    image: timescale/timescaledb:latest-pg15
    container_name: aetherix_timescaledb
    environment:
      POSTGRES_DB: aetherix_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aetherix_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./aetherix.db  # Change to postgresql://postgres:postgrespassword@db:5432/aetherix_db for TimescaleDB
    depends_on:
      - db
    volumes:
      - .:/app

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: aetherix_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  timescale_data:
